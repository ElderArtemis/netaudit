<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NetAudit{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <span class="prompt">root@netaudit:~#</span>
            <span class="brand-name">NetAudit</span>
        </div>
        <nav>
            <a href="/">dashboard</a>
            <a href="/docs">api</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <span>NetAudit v1.0 · Solo para uso autorizado</span>
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
